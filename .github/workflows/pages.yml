name: Publish the iPhone web app (GitHub Pages)
# Publishes app/ (the FINLAB web app, updated by the source repository on each release) at
# https://amira-m-kastour.github.io/amira-kastour-finlab-downloads/
# One-time setting: Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: app }
      - id: d
        uses: actions/deploy-pages@v4
